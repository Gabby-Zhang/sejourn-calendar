name: Diagnose EbS planning feed

# 一次性诊断:EbS 拍摄计划为什么 0 条。只读,不提交任何东西。
on:
  workflow_dispatch:
  push:
    branches: [ccr-fd02ae65-ur8lvy]
    paths: [scripts/diag_ebs.py, .github/workflows/diag_ebs.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/diag_ebs.py
